spring:
  config:
    activate:
      on-profile: local

  flyway:
    url: jdbc:postgresql://localhost:5432/salon_explorer
    user: salon_admin
    password: ${POSTGRES_PASSWORD:change_me_in_production}

  datasource:
    url: jdbc:postgresql://localhost:5432/salon_explorer
    username: salon_app
    password: ${APP_DB_PASSWORD:change_me_app_password}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: SalonHikariPool
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      leak-detection-threshold: 60000

google:
  places:
    api-key: ${GOOGLE_MAPS_API_KEY}
    base-url: https://places.googleapis.com/v1
    language-code: ${GOOGLE_PLACES_LANGUAGE:pl}
    region-code: ${GOOGLE_PLACES_REGION:pl}
    connect-timeout-ms: 5000
    read-timeout-ms: 15000

ingestion:
  batch-size: ${INGESTION_BATCH_SIZE:20}
  rate-limit-per-second: ${INGESTION_RATE_LIMIT_PER_SECOND:10}
  max-retries: 3
  retry-backoff-ms: 1000
  search-queries:
    - "beauty salon Warsaw"
    - "hair salon Warsaw"
    - "barber Warsaw"
    - "nail salon Warsaw"
    - "spa Warsaw"

logging:
  level:
    org.flywaydb: INFO
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE
